[package]
name = "hyped-fs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Hypertextual workspace models and persistence services."
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
trash = "=5.2.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
