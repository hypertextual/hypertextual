[package]
name = "hypertextual-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal placeholder-backed Tauri v2 application template."
publish = false
license = "Apache-2.0"

[lib]
name = "premise_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
trash = "=5.2.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
