[package]
name = "hypertextual"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal Clap-derived command-line interface template."
license = "Apache-2.0"

[[bin]]
name = "hyped"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.20"
clap = { version = "4.6.6", features = ["derive"] }
