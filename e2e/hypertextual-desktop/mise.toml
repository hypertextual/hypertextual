[tools]
bun = "1.4.2"

[tasks.install]
description = "Install the pinned Playwright browser engines"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright install chromium webkit"

[tasks.test]
description = "Run desktop workspace and editor browser journeys"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/hypertextual-desktop/playwright.config.ts"

[tasks.smoke]
description = "Run representative workspace and editor journeys"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/hypertextual-desktop/playwright.config.ts --grep @smoke"

[tasks.list]
description = "List desktop browser journeys without running them"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/hypertextual-desktop/playwright.config.ts --list"

[tasks.lint]
description = "Lint and type-check desktop E2E sources"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = ["bunx --no-install eslint e2e/hypertextual-desktop", "bunx --no-install tsc --project e2e/hypertextual-desktop/tsconfig.json"]

[tasks.format]
dir = "{{config_root}}/../.."
run = "bunx --no-install prettier --write e2e/hypertextual-desktop"

[tasks."format:check"]
dir = "{{config_root}}/../.."
run = "bunx --no-install prettier --check e2e/hypertextual-desktop"
