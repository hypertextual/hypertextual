[tools]
bun = "1.4.2"

[tasks.install]
description = "Install the pinned Playwright browser engines"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright install chromium webkit"

[tasks.test]
description = "Run standalone HtmdEditor browser integration tests"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/htmd-ts/playwright.config.ts"

[tasks.smoke]
description = "Run representative HtmdEditor browser integration tests"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/htmd-ts/playwright.config.ts --grep @smoke"

[tasks.list]
description = "List HtmdEditor browser integration tests without running them"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/htmd-ts/playwright.config.ts --list"

[tasks.lint]
description = "Lint and type-check HtmdEditor E2E sources"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = ["bunx --no-install eslint e2e/htmd-ts", "bunx --no-install tsc --project e2e/htmd-ts/tsconfig.json"]

[tasks.format]
dir = "{{config_root}}/../.."
run = "bunx --no-install prettier --write e2e/htmd-ts"

[tasks."format:check"]
dir = "{{config_root}}/../.."
run = "bunx --no-install prettier --check e2e/htmd-ts"
