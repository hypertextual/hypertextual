---
name: On Deploy

'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: stage

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run on-release flow
        uses: cloudvoyant/premise@v0.4.3
        with:
          flow: on-release
          environment: ${{ inputs.environment }}
          install-premise: ${{ runner.os == 'Windows' && 'build' || 'pre-built' }}
          premise-version: v0.4.3
