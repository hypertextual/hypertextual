# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
_.path = ["{{config_root}}/bin"]

[monorepo]
config_roots = ["apps/*", "libs/*", "e2e/*"]

[tools]
bun = "1.4.2"
node = "24"
rust = { version = "1.88", components = "rustfmt,clippy,rust-analyzer" }

[tasks.install]
description = "Install shared Bun workspace dependencies"
run = "bun install"

[tasks.dev]
description = "Run the Tauri desktop application in development mode"
run = "mise run //apps/hypertextual-desktop:dev"

[tasks.run]
description = "Run the Tauri desktop application"
run = "mise run //apps/hypertextual-desktop:run"
